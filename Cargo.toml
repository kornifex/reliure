[package]
name = "reliure"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Bind Obsidian notes into EPUB books for e-readers"
license = "MIT"
repository = "https://github.com/kornifex/reliure"
readme = "README.md"
keywords = ["obsidian", "epub", "ebook", "markdown", "e-reader"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
epub-builder = { version = "0.8.3", default-features = false, features = ["zip-library"] }
pulldown-cmark = "0.13.6"
pulldown-cmark-escape = "0.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "multipart"] }
serde_yaml_ng = "0.10.0"
walkdir = "2.5.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# An invariant is spelled out in `expect`, where it shows if it ever breaks.
unwrap_used = "warn"
# `#[expect]` rather than `#[allow]`: it warns once the lint it silences no longer fires.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[dev-dependencies]
tempfile = "3.27.0"

# A smaller, faster binary for `cargo install`, at the cost of a slower release build.
[profile.release]
lto = true
codegen-units = 1
strip = true
